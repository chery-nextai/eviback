[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "eviback"
version = "0.1.0rc1"
description = "Evidence-constrained Teacher fallback for search-agent GRPO training"
readme = "README.md"
requires-python = ">=3.10"
license = {file = "LICENSE"}
authors = [{name = "EviBack contributors"}]
dependencies = [
  "numpy>=1.26,<3",
  "PyYAML>=6.0",
]

[project.optional-dependencies]
data = ["pandas>=2.0", "pyarrow>=15"]
inference = ["openai>=1.40"]
retrieval = ["faiss-cpu>=1.8", "sentence-transformers>=3.0", "fastapi>=0.110", "uvicorn>=0.29"]
train = [
  "torch>=2.4",
  "transformers==4.57.6",
  "vllm==0.11.0",
  "ray>=2.40",
  "verl @ git+https://github.com/volcengine/verl.git",
]
test = ["pytest>=8.0", "pytest-cov>=5.0"]

[project.scripts]
eviback-prepare-data = "eviback.data:main"
eviback-infer = "eviback.inference:main"
eviback-evaluate = "eviback.evaluation:main"
eviback-train = "eviback.training.entrypoint:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"