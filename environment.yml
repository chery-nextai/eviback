# CUDA/GPU profile. The Ascend NPU profile is environment-npu.yml.
name: eviback-gpu
channels:
  - pytorch
  - nvidia
  - conda-forge
dependencies:
  - python=3.11
  - pytorch=2.8.0
  - pytorch-cuda=12.4
  - numpy>=1.26
  - pandas>=2.0
  - pyarrow>=15
  - pyyaml>=6.0
  - pip
  - pip:
      - transformers==4.57.6
      - vllm==0.11.0
      - ray>=2.40
      - pytest>=8.0